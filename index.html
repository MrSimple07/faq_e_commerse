<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopAssist — FAQ Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd6;
    --text: #1a1714;
    --text-muted: #7a746c;
    --accent: #d4521a;
    --accent-light: #fdf0ea;
    --user-bubble: #1a1714;
    --user-text: #f5f3ef;
    --bot-bubble: #ffffff;
    --bot-text: #1a1714;
    --shadow: 0 4px 24px rgba(26,23,20,0.08);
    --shadow-sm: 0 2px 8px rgba(26,23,20,0.06);
    --radius: 18px;
    --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
  }

  [data-theme="dark"] {
    --bg: #141210;
    --surface: #1e1b18;
    --surface2: #252118;
    --border: #2e2a24;
    --text: #f0ede8;
    --text-muted: #8a8279;
    --accent: #e86030;
    --accent-light: #2a1a10;
    --user-bubble: #e86030;
    --user-text: #ffffff;
    --bot-bubble: #252118;
    --bot-text: #f0ede8;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition), color var(--transition);
    padding: 20px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(212,82,26,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(212,82,26,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .chat-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 540px;
    display: flex;
    flex-direction: column;
    height: 90vh;
    max-height: 780px;
  }

  .chat-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }

  .header-left { display: flex; align-items: center; gap: 14px; }

  .avatar {
    width: 42px; height: 42px;
    background: var(--accent);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(212,82,26,0.3);
  }

  .header-info h1 {
    font-family: 'Syne', sans-serif;
    font-size: 16px; font-weight: 700;
    letter-spacing: -0.3px; color: var(--text);
  }

  .status {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text-muted); margin-top: 2px;
  }

  .status-dot {
    width: 7px; height: 7px;
    background: #22c55e; border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .header-actions { display: flex; align-items: center; gap: 8px; }

  .icon-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    color: var(--text-muted); font-size: 16px;
  }

  .icon-btn:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .chat-body {
    flex: 1; overflow-y: auto;
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-body::-webkit-scrollbar { width: 4px; }
  .chat-body::-webkit-scrollbar-track { background: transparent; }
  .chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .message-row {
    display: flex; gap: 10px;
    animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 2px;
  }

  .message-row.bot .msg-avatar {
    background: var(--accent);
    box-shadow: 0 2px 8px rgba(212,82,26,0.25);
  }

  .message-row.user .msg-avatar {
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .bubble-wrap {
    display: flex; flex-direction: column; gap: 4px;
    max-width: calc(100% - 80px);
  }

  .message-row.user .bubble-wrap { align-items: flex-end; }

  .bubble {
    padding: 12px 16px; border-radius: 16px;
    font-size: 14px; line-height: 1.6;
    position: relative; word-break: break-word;
  }

  .message-row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }

  .message-row.bot .bubble {
    background: var(--bot-bubble);
    color: var(--bot-text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow-sm);
  }

  .bubble-meta {
    display: flex; align-items: center; gap: 8px;
  }

  .message-row.user .bubble-meta { flex-direction: row-reverse; }

  .timestamp { font-size: 11px; color: var(--text-muted); }

  .copy-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 11px;
    padding: 2px 6px; border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; gap: 3px;
    opacity: 0; transition: opacity 0.2s, background 0.2s, color 0.2s;
  }

  .bubble-wrap:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--accent-light); color: var(--accent); }
  .copy-btn.copied { color: #22c55e; opacity: 1; }

  .typing-indicator {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 4px;
  }

  .typing-dot {
    width: 7px; height: 7px;
    background: var(--text-muted); border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .typing-cursor::after {
    content: '|';
    animation: blink 0.7s infinite;
    font-weight: 300;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .welcome {
    text-align: center; padding: 24px 16px;
    color: var(--text-muted);
  }

  .welcome-icon { font-size: 36px; margin-bottom: 12px; }

  .welcome h2 {
    font-family: 'Syne', sans-serif;
    font-size: 18px; font-weight: 700;
    color: var(--text); margin-bottom: 6px;
  }

  .welcome p { font-size: 13px; line-height: 1.5; }

  .quick-questions {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 16px;
  }

  .quick-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 14px;
    font-size: 12px; font-family: 'DM Sans', sans-serif;
    color: var(--text); cursor: pointer;
    transition: all var(--transition);
  }

  .quick-btn:hover {
    background: var(--accent-light);
    border-color: var(--accent); color: var(--accent);
    transform: translateY(-1px);
  }

  .chat-footer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 16px; box-shadow: var(--shadow);
  }

  .input-row { display: flex; gap: 10px; align-items: flex-end; }

  #question {
    flex: 1; padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--surface2); color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    outline: none; transition: all var(--transition);
    resize: none; height: 46px; max-height: 120px; line-height: 1.5;
  }

  #question::placeholder { color: var(--text-muted); }

  #question:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(212,82,26,0.1);
  }

  .send-btn {
    width: 46px; height: 46px;
    background: var(--accent); color: white;
    border: none; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    transition: all var(--transition);
    box-shadow: 0 2px 12px rgba(212,82,26,0.3);
  }

  .send-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(212,82,26,0.4);
  }

  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .footer-hint {
    font-size: 11px; color: var(--text-muted);
    margin-top: 10px; text-align: center;
  }

  .clear-btn {
    background: none; border: none;
    font-size: 11px; color: var(--text-muted);
    cursor: pointer; text-decoration: underline;
    font-family: 'DM Sans', sans-serif;
    transition: color var(--transition);
  }

  .clear-btn:hover { color: var(--accent); }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 10px 20px; border-radius: 24px;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    opacity: 0; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    z-index: 1000; white-space: nowrap; pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="chat-wrapper">
  <div class="chat-header">
    <div class="header-left">
      <div class="avatar">🛍️</div>
      <div class="header-info">
        <h1>ShopAssist</h1>
        <div class="status">
          <div class="status-dot"></div>
          <span>Online · Instant replies</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle dark mode" id="themeBtn">🌙</button>
      <button class="icon-btn" onclick="clearHistory()" title="Clear chat">🗑️</button>
    </div>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">👋</div>
      <h2>Hi there! How can I help?</h2>
      <p>Ask me anything about shipping, returns,<br>orders, or products.</p>
      <div class="quick-questions">
        <button class="quick-btn" onclick="quickAsk('How long does shipping take?')">📦 Shipping time</button>
        <button class="quick-btn" onclick="quickAsk('What is your return policy?')">↩️ Return policy</button>
        <button class="quick-btn" onclick="quickAsk('What payment methods do you accept?')">💳 Payment options</button>
        <button class="quick-btn" onclick="quickAsk('How do I track my order?')">🔍 Track order</button>
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <div class="input-row">
      <textarea id="question" placeholder="Type your question..."></textarea>
      <button class="send-btn" id="sendBtn" onclick="ask()">➤</button>
    </div>
    <div class="footer-hint">
      Press <strong>Enter</strong> to send &nbsp;·&nbsp; <button class="clear-btn" onclick="clearHistory()">clear chat</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WEBHOOK_URL = "https://mrsimple07.app.n8n.cloud/webhook-test/3975dd95-f812-4279-a614-1ce39708303a";
let chatHistory = [];
let isLoading = false;

try { chatHistory = JSON.parse(localStorage.getItem('faq_history') || '[]'); } catch(e) { chatHistory = []; }

window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('faq_theme') || 'light';
  if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeBtn').textContent = '☀️';
  }

  if (chatHistory.length > 0) {
    const w = document.getElementById('welcome');
    if (w) w.remove();
    chatHistory.forEach(msg => renderMessage(msg.role, msg.text, msg.time, false));
  }

  const ta = document.getElementById('question');
  ta.addEventListener('input', () => {
    ta.style.height = '46px';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
  });
});

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeBtn').textContent = '🌙';
    localStorage.setItem('faq_theme', 'light');
  } else {
    document.getElementById('themeBtn').textContent = '☀️';
    localStorage.setItem('faq_theme', 'dark');
  }
}

function quickAsk(q) {
  document.getElementById('question').value = q;
  ask();
}

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function renderMessage(role, text, time, animate) {
  if (animate === undefined) animate = true;
  const body = document.getElementById('chatBody');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = 'message-row ' + role;
  if (!animate) row.style.animation = 'none';

  const avatarEmoji = role === 'user' ? '👤' : '🛍️';
  const safeText = escapeHtml(text);
  const copyPart = role === 'bot'
    ? '<button class="copy-btn" onclick="copyMsg(this)">📋 Copy</button>'
    : '';

  row.innerHTML =
    '<div class="msg-avatar">' + avatarEmoji + '</div>' +
    '<div class="bubble-wrap">' +
      '<div class="bubble" data-raw="' + escapeAttr(text) + '">' + safeText + '</div>' +
      '<div class="bubble-meta">' +
        '<span class="timestamp">' + time + '</span>' +
        copyPart +
      '</div>' +
    '</div>';

  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
  return row;
}

function renderTypingIndicator() {
  const body = document.getElementById('chatBody');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = 'message-row bot';
  row.id = 'typingRow';
  row.innerHTML =
    '<div class="msg-avatar">🛍️</div>' +
    '<div class="bubble-wrap">' +
      '<div class="bubble">' +
        '<div class="typing-indicator">' +
          '<div class="typing-dot"></div>' +
          '<div class="typing-dot"></div>' +
          '<div class="typing-dot"></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
  return row;
}

async function typeText(element, text) {
  element.classList.add('typing-cursor');
  element.textContent = '';
  const speed = Math.max(10, Math.min(28, 1400 / text.length));
  for (let i = 0; i < text.length; i++) {
    element.textContent += text[i];
    const body = document.getElementById('chatBody');
    if (body) body.scrollTop = body.scrollHeight;
    await new Promise(r => setTimeout(r, speed));
  }
  element.classList.remove('typing-cursor');
}

async function ask() {
  if (isLoading) return;
  const input = document.getElementById('question');
  const q = input.value.trim();
  if (!q) return;

  isLoading = true;
  input.value = '';
  input.style.height = '46px';
  document.getElementById('sendBtn').disabled = true;

  const time = getTime();
  renderMessage('user', q, time, true);
  chatHistory.push({ role: 'user', text: q, time: time });
  saveHistory();

  const typingRow = renderTypingIndicator();

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });

    if (!res.ok) throw new Error('Status ' + res.status);
    const data = await res.json();
    const answer = data.answer || data.output || data.text || JSON.stringify(data);

    typingRow.remove();

    const answerTime = getTime();
    const body = document.getElementById('chatBody');
    const row = document.createElement('div');
    row.className = 'message-row bot';
    row.innerHTML =
      '<div class="msg-avatar">🛍️</div>' +
      '<div class="bubble-wrap">' +
        '<div class="bubble typing-target" data-raw="' + escapeAttr(answer) + '"></div>' +
        '<div class="bubble-meta">' +
          '<span class="timestamp">' + answerTime + '</span>' +
          '<button class="copy-btn" onclick="copyMsg(this)">📋 Copy</button>' +
        '</div>' +
      '</div>';
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;

    await typeText(row.querySelector('.typing-target'), answer);

    chatHistory.push({ role: 'bot', text: answer, time: answerTime });
    saveHistory();

  } catch(err) {
    typingRow.remove();
    const errMsg = "Sorry, I couldn't connect right now. Please try again in a moment.";
    const t = getTime();
    renderMessage('bot', errMsg, t, true);
    chatHistory.push({ role: 'bot', text: errMsg, time: t });
    saveHistory();
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function copyMsg(btn) {
  const bubble = btn.closest('.bubble-wrap').querySelector('.bubble');
  const text = bubble.getAttribute('data-raw') || bubble.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    showToast('Copied to clipboard!');
    setTimeout(() => {
      btn.textContent = '📋 Copy';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function clearHistory() {
  chatHistory = [];
  saveHistory();
  const body = document.getElementById('chatBody');
  body.innerHTML =
    '<div class="welcome" id="welcome">' +
      '<div class="welcome-icon">👋</div>' +
      '<h2>Hi there! How can I help?</h2>' +
      '<p>Ask me anything about shipping, returns,<br>orders, or products.</p>' +
      '<div class="quick-questions">' +
        '<button class="quick-btn" onclick="quickAsk(\'How long does shipping take?\')">📦 Shipping time</button>' +
        '<button class="quick-btn" onclick="quickAsk(\'What is your return policy?\')">↩️ Return policy</button>' +
        '<button class="quick-btn" onclick="quickAsk(\'What payment methods do you accept?\')">💳 Payment options</button>' +
        '<button class="quick-btn" onclick="quickAsk(\'How do I track my order?\')">🔍 Track order</button>' +
      '</div>' +
    '</div>';
  showToast('Chat cleared');
}

function saveHistory() {
  try { localStorage.setItem('faq_history', JSON.stringify(chatHistory.slice(-60))); } catch(e) {}
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function escapeHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeAttr(t) {
  return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>

</html>
